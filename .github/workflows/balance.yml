# Raft Rush acceptance gate: one command (`npm run balance`) runs 30 fixed seeds for the expert cohort
# (Normal, 3 bots) and 30 for the novice cohort (Normal, 2 bots + 1 idle human) on the real RaftWorld + BotDesk.
# The per-seed table (boss spawn, launch second, outcome, downs) and the gate summary land in the run summary;
# any gate violation fails the job. Thresholds (2 Nov 2026):
#   boss spawn 100 % · expert launch median 440–460 s · expert win 55–75 % · novice win 40–50 % · no cohort < 15 %.
# A failing run is the point: it means the beta is not accepted yet, not that CI is broken.
name: Raft Rush acceptance

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - feat/raft-rush-fun
      - feat/raft-rush-acceptance
    paths:
      - "games/raft-rush/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/balance.yml"
  pull_request:
    paths:
      - "games/raft-rush/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/balance.yml"

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Raft Rush acceptance gate (30 seeds x 2 cohorts)
        shell: bash
        env:
          NO_COLOR: "1"
        run: |
          set +e
          npm run balance 2>&1 | tee balance.txt
          status=${PIPESTATUS[0]}
          { echo "## Raft Rush acceptance gate"; echo '```'; cat balance.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
