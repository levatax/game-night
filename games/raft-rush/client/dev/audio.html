<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raft Rush · Audio harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #2d2a32;
        --yellow: #ffd166;
        --red: #ff5a5f;
        --green: #7ccb6b;
        --paper: #fff4dc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: linear-gradient(#7fd3f5, #f4e4b0 520px) fixed;
        color: var(--ink);
        font-family: "Fredoka", system-ui, sans-serif;
        font-size: 14px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 10px 16px;
        background: var(--ink);
        color: #fff;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
      }
      header h1 {
        margin: 0;
        font-size: 22px;
      }
      header h1 span {
        color: var(--yellow);
      }
      #status {
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--red);
        font-weight: 600;
      }
      #status.on {
        background: #3cb371;
      }
      #meter {
        width: 220px;
        height: 44px;
        border-radius: 8px;
        background: #1c1a20;
      }
      main {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 14px;
        padding: 14px 16px 40px;
      }
      section {
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 16px;
        box-shadow: 0 5px 0 var(--ink);
        padding: 10px 12px 12px;
      }
      section.wide {
        grid-column: 1 / -1;
      }
      section h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      section h3 {
        margin: 8px 0 3px;
        font-size: 13px;
        color: #6b6670;
      }
      button {
        font: inherit;
        font-size: 12px;
        margin: 2px;
        padding: 3px 8px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: var(--yellow);
        cursor: pointer;
      }
      button.on {
        background: var(--green);
      }
      button:active {
        transform: translateY(1px);
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin: 2px 8px 2px 0;
      }
      input[type="range"] {
        width: 110px;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
      }
      td,
      th {
        padding: 1px 6px;
        text-align: left;
      }
      .hint {
        color: #6b6670;
        font-size: 12px;
      }
      header label {
        color: #fff;
      }
      pre {
        margin: 4px 0;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Raft Rush <span>· audio</span></h1>
      <button id="unlock">🔊 Unlock audio</button>
      <span id="status">locked</span>
      <canvas id="meter" width="220" height="44"></canvas>
      <span id="counts"></span>
    </header>
    <main id="main"></main>
    <script type="module" src="./audio.ts"></script>
  </body>
</html>
