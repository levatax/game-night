<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raft Rush · Island harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #102a4a;
        color: #2d2a32;
        font-family: "Fredoka", system-ui, sans-serif;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        width: 300px;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        background: rgba(255, 244, 220, 0.93);
        border: 3px solid #2d2a32;
        border-radius: 14px;
        padding: 6px 10px 8px;
        font-size: 13px;
        box-shadow: 0 4px 0 #2d2a32;
      }
      #panel.hidden {
        display: none;
      }
      #panel h2 {
        margin: 8px 0 3px;
        font-size: 14px;
      }
      #panel button {
        font: inherit;
        font-size: 12px;
        margin: 2px;
        padding: 3px 7px;
        border: 2px solid #2d2a32;
        border-radius: 8px;
        background: #ffd166;
        cursor: pointer;
      }
      #panel button.on {
        background: #7ccb6b;
      }
      #panel label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      #panel label span {
        width: 74px;
      }
      #panel input[type="range"] {
        flex: 1;
      }
      #panel input[type="number"] {
        width: 110px;
        font: inherit;
      }
      #panel .keys {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.35;
        opacity: 0.8;
      }
      #stats {
        position: fixed;
        right: 8px;
        bottom: 8px;
        background: rgba(45, 42, 50, 0.82);
        color: #fff;
        padding: 4px 8px;
        border-radius: 8px;
        font-size: 12px;
        white-space: pre;
        font-variant-numeric: tabular-nums;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 0 2px rgba(45, 42, 50, 0.6);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="crosshair"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <script type="module" src="./island.ts"></script>
  </body>
</html>
