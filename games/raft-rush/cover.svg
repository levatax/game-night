<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Sunset over a palm island: a half-built raft by a campfire, red crab eyes glowing in the surf">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2C6B"/>
      <stop offset="0.45" stop-color="#C9577A"/>
      <stop offset="0.78" stop-color="#FF9A5A"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB7D9"/>
      <stop offset="0.5" stop-color="#1D5E86"/>
      <stop offset="1" stop-color="#102A4A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4DC"/>
      <stop offset="0.6" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB347" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4D3A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF4D3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="455" cy="232" r="120" fill="url(#sun)"/>
  <circle cx="455" cy="232" r="54" fill="#FFE9A8"/>
  <g fill="#FFC9B5" opacity="0.75">
    <rect x="60" y="70" width="120" height="16" rx="8"/>
    <rect x="96" y="56" width="70" height="18" rx="9"/>
    <rect x="470" y="92" width="110" height="14" rx="7"/>
    <rect x="500" y="80" width="54" height="16" rx="8"/>
  </g>

  <!-- sea -->
  <rect y="232" width="640" height="168" fill="url(#sea)"/>
  <g stroke="#FFE9A8" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M410 246h90M425 258h60M438 270h34"/>
  </g>
  <g stroke="#9EE3F5" stroke-width="3" stroke-linecap="round" opacity="0.45">
    <path d="M540 300h50M20 286h46M560 338h44"/>
  </g>

  <!-- island -->
  <path d="M-20 400 C 30 290, 170 262, 300 286 C 360 296, 392 330, 404 400 Z" fill="#F4E4B0" stroke="#2D2A32" stroke-width="5" stroke-linejoin="round"/>
  <path d="M-20 400 C 40 318, 150 300, 250 312 C 300 318, 330 346, 340 400 Z" fill="#7CCB6B" opacity="0.9"/>
  <path d="M296 286 C 350 294, 384 324, 398 372" fill="none" stroke="#FFF4DC" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- palm -->
  <path d="M96 318 C 104 250, 128 196, 168 162" fill="none" stroke="#2D2A32" stroke-width="16" stroke-linecap="round"/>
  <path d="M96 318 C 104 250, 128 196, 168 162" fill="none" stroke="#B07A45" stroke-width="10" stroke-linecap="round"/>
  <g fill="#3E8E52" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round">
    <path d="M168 162 C 130 132, 92 138, 66 162 C 104 150, 134 156, 168 168 Z"/>
    <path d="M168 162 C 152 120, 116 102, 88 106 C 120 120, 142 140, 164 170 Z"/>
    <path d="M168 162 C 196 118, 236 112, 262 128 C 230 128, 200 146, 172 170 Z"/>
    <path d="M168 162 C 210 150, 244 164, 262 194 C 232 174, 202 170, 170 170 Z"/>
    <path d="M168 162 C 176 124, 170 96, 152 76 C 174 104, 182 132, 174 168 Z"/>
  </g>
  <g fill="#8A5A2B" stroke="#2D2A32" stroke-width="3">
    <circle cx="162" cy="174" r="8"/>
    <circle cx="176" cy="172" r="8"/>
  </g>

  <!-- campfire -->
  <circle cx="232" cy="318" r="46" fill="url(#fire)"/>
  <g stroke="#2D2A32" stroke-width="4" stroke-linecap="round">
    <path d="M212 330 L252 318M214 318 L252 332"/>
  </g>
  <path d="M232 296 C 222 310, 222 322, 232 326 C 244 322, 244 308, 232 296 Z" fill="#FFB347" stroke="#2D2A32" stroke-width="3" stroke-linejoin="round"/>
  <path d="M232 308 C 228 316, 229 321, 232 323 C 237 320, 237 314, 232 308 Z" fill="#FFF4DC"/>

  <!-- half-built raft -->
  <g transform="rotate(-6 330 330)" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round">
    <rect x="270" y="326" width="120" height="14" rx="7" fill="#C98A4B"/>
    <rect x="276" y="312" width="104" height="14" rx="7" fill="#B07A45"/>
    <rect x="286" y="340" width="70" height="12" rx="6" fill="#B07A45"/>
    <path d="M330 312 V 238" fill="none" stroke-width="7" stroke-linecap="round"/>
    <path d="M330 312 V 238" fill="none" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/>
    <path d="M334 244 C 368 256, 378 282, 372 302 L 334 302 Z" fill="#FFF4DC"/>
    <path d="M300 326 l8 -14 M352 326 l-6 -14" fill="none" stroke="#FFD166" stroke-width="3"/>
  </g>

  <!-- crab eyes in the surf -->
  <g>
    <circle cx="486" cy="352" r="22" fill="url(#eye)"/>
    <circle cx="560" cy="318" r="18" fill="url(#eye)"/>
    <circle cx="604" cy="372" r="20" fill="url(#eye)"/>
    <g fill="#FF4D3A" stroke="#2D2A32" stroke-width="2">
      <circle cx="478" cy="352" r="5"/><circle cx="494" cy="352" r="5"/>
      <circle cx="553" cy="318" r="4"/><circle cx="567" cy="318" r="4"/>
      <circle cx="597" cy="372" r="4.5"/><circle cx="611" cy="372" r="4.5"/>
    </g>
    <g fill="#FFF4DC">
      <circle cx="480" cy="350" r="1.6"/><circle cx="496" cy="350" r="1.6"/>
      <circle cx="555" cy="316" r="1.3"/><circle cx="569" cy="316" r="1.3"/>
    </g>
  </g>

  <!-- title -->
  <g font-family="Fredoka, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="700" text-anchor="middle">
    <text x="428" y="162" font-size="58" fill="#2D2A32" stroke="#2D2A32" stroke-width="12" stroke-linejoin="round">RAFT RUSH</text>
    <text x="428" y="162" font-size="58" fill="#FFD166">RAFT <tspan fill="#3FB7D9">RUSH</tspan></text>
    <text x="428" y="192" font-size="17" fill="#FFF4DC" stroke="#2D2A32" stroke-width="5" stroke-linejoin="round" paint-order="stroke">build the raft before the storm</text>
  </g>
</svg>
