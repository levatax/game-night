<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bonk Brawl · Characters harness</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6ec6ff;
        color: #2d2a32;
        font-family: "Fredoka", system-ui, sans-serif;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #panel {
        position: fixed;
        top: 8px;
        left: 8px;
        width: 290px;
        max-height: calc(100% - 16px);
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.9);
        border: 3px solid #2d2a32;
        border-radius: 14px;
        padding: 6px 10px;
        font-size: 13px;
        box-shadow: 0 4px 0 #2d2a32;
      }
      #panel h2 {
        margin: 8px 0 3px;
        font-size: 14px;
      }
      #panel button {
        font: inherit;
        font-size: 12px;
        margin: 2px;
        padding: 2px 7px;
        border: 2px solid #2d2a32;
        border-radius: 8px;
        background: #ffcf33;
        cursor: pointer;
      }
      #panel button.on {
        background: #7be07b;
      }
      #panel button:active {
        transform: translateY(1px);
      }
      #panel select {
        font: inherit;
      }
      #stats {
        position: fixed;
        right: 8px;
        top: 8px;
        background: rgba(45, 42, 50, 0.82);
        color: #fff;
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 12px;
        white-space: pre;
        font-family: ui-monospace, Menlo, monospace;
      }
      #faces {
        position: fixed;
        left: 310px;
        bottom: 8px;
        display: none;
        gap: 6px;
        padding: 6px;
        background: repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 16px 16px;
        border: 3px solid #2d2a32;
        border-radius: 10px;
      }
      #faces canvas {
        width: 150px;
        height: 150px;
        border: 1px solid #2d2a32;
      }
      #previewBox {
        position: fixed;
        right: 8px;
        bottom: 8px;
        width: 320px;
        display: none;
        padding: 10px;
        background: #fff7e6;
        border: 3px solid #2d2a32;
        border-radius: 16px;
        box-shadow: 0 4px 0 #2d2a32;
      }
      /* Mirrors the lobby carousel stage in ui.css. */
      .stage {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 300px;
      }
      .pedestal {
        position: absolute;
        bottom: 4%;
        left: 50%;
        width: min(66%, 260px);
        aspect-ratio: 3.2;
        transform: translateX(-50%);
        background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--slot) 75%, white), var(--slot));
        border: 3px solid #2d2a32;
        border-radius: 50%;
      }
      #previewCanvas {
        position: relative;
        width: 300px;
        height: 300px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="panel"></div>
    <div id="stats"></div>
    <div id="faces"></div>
    <div id="previewBox">
      <div class="stage" id="stage"><div class="pedestal"></div><canvas id="previewCanvas"></canvas></div>
    </div>
    <script type="module" src="./client-characters.ts"></script>
  </body>
</html>
