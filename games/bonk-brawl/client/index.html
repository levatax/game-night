<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bonk Brawl</title>
    <meta name="description" content="Bonk Brawl: a cartoony 3D dodgeball free-for-all for 2-8 friends in the browser." />
    <meta name="theme-color" content="#6EC6FF" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23FFF4DC' stroke='%232D2A32' stroke-width='5'/%3E%3Cpath d='M12 26c12 6 28 6 40 0' fill='none' stroke='%23FF5A5F' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='16' r='5' fill='%23FFCF33' stroke='%232D2A32' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #6ec6ff;
        color: #2d2a32;
        font-family: "Fredoka", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game" aria-hidden="true"></div>
    <div id="ui"></div>
    <noscript>Bonk Brawl needs JavaScript and WebGL.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
