<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="A leaning tower of a toaster, a rubber chicken, a googly-eyed jelly and a fish wobbles on a birthday cake in a night kitchen, next to a glowing gold times five card, while a devilish chef peeks in">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1D33"/>
      <stop offset="1" stop-color="#2D2A44"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD9A0" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#FFD9A0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFD9A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFCF33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE38A"/>
      <stop offset="0.55" stop-color="#FFCF33"/>
      <stop offset="1" stop-color="#E8A317"/>
    </linearGradient>
    <linearGradient id="jelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF59B"/>
      <stop offset="1" stop-color="#4CC46A"/>
    </linearGradient>
    <pattern id="checks" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#FFFFFF"/>
      <rect width="20" height="20" fill="#FF5A5F"/>
      <rect x="20" y="20" width="20" height="20" fill="#FF5A5F"/>
    </pattern>
  </defs>

  <!-- night kitchen wall -->
  <rect width="640" height="400" fill="url(#wall)"/>
  <g fill="#36334F">
    <rect x="0" y="150" width="640" height="2"/>
    <rect x="0" y="190" width="640" height="2"/>
    <rect x="0" y="230" width="640" height="2"/>
    <rect x="0" y="270" width="640" height="2"/>
  </g>

  <!-- window with moon -->
  <g>
    <rect x="34" y="34" width="120" height="96" rx="8" fill="#16152A" stroke="#2D2A32" stroke-width="5"/>
    <circle cx="112" cy="66" r="16" fill="#FFF3B0"/>
    <circle cx="104" cy="62" r="14" fill="#16152A"/>
    <g fill="#FFF3B0"><circle cx="58" cy="54" r="2"/><circle cx="76" cy="98" r="1.6"/><circle cx="132" cy="110" r="2"/></g>
    <path d="M94 34 V130 M34 82 H154" stroke="#2D2A32" stroke-width="5"/>
  </g>

  <!-- hanging lamp and its warm pool of light -->
  <ellipse cx="300" cy="230" rx="260" ry="190" fill="url(#lamp)"/>
  <path d="M206 0 V22" stroke="#2D2A32" stroke-width="4"/>
  <path d="M178 42 Q206 14 234 42 Z" fill="#FF5A5F" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="206" cy="46" r="8" fill="#FFF3B0"/>

  <!-- neon casino sign over the fridge (right) -->
  <g>
    <rect x="512" y="150" width="112" height="250" rx="14" fill="#BFE3F2" stroke="#2D2A32" stroke-width="5"/>
    <path d="M512 228 H624" stroke="#2D2A32" stroke-width="4"/>
    <rect x="524" y="170" width="8" height="40" rx="4" fill="#2D2A32"/>
    <rect x="524" y="244" width="8" height="54" rx="4" fill="#2D2A32"/>
    <!-- fridge magnet: banana -->
    <path d="M574 262 Q596 278 608 258" fill="none" stroke="#2D2A32" stroke-width="10" stroke-linecap="round"/>
    <path d="M574 262 Q596 278 608 258" fill="none" stroke="#FFD84D" stroke-width="5" stroke-linecap="round"/>
    <rect x="502" y="96" width="132" height="42" rx="10" fill="#1A1830" stroke="#FF8BD1" stroke-width="4"/>
    <text x="568" y="125" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-weight="700" font-size="22" fill="#FFB7D5" stroke="#FF8BD1" stroke-width="0.8" letter-spacing="1">JACKPOT</text>
    <g fill="#FFCF33"><circle cx="512" cy="106" r="3"/><circle cx="624" cy="106" r="3"/><circle cx="512" cy="128" r="3"/><circle cx="624" cy="128" r="3"/></g>
  </g>

  <!-- devil tail sneaking out -->
  <path d="M30 318 Q6 292 30 278" fill="none" stroke="#2D2A32" stroke-width="9" stroke-linecap="round"/>
  <path d="M30 318 Q6 292 30 278" fill="none" stroke="#FF5A5F" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M30 278 L22 262 L42 270 Z" fill="#FF5A5F" stroke="#2D2A32" stroke-width="3" stroke-linejoin="round"/>
  <!-- little chef with devil hat peeking from the left edge of the table -->
  <g transform="translate(82 304)">
    <!-- devil-horned chef hat -->
    <path d="M-36 -58 L-44 -84 L-24 -66 Z" fill="#FF5A5F" stroke="#2D2A32" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M36 -58 L44 -84 L24 -66 Z" fill="#FF5A5F" stroke="#2D2A32" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-30 -48 Q-46 -76 -18 -80 Q0 -100 18 -80 Q46 -76 30 -48 Z" fill="#FFFFFF" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-32" y="-52" width="64" height="12" rx="4" fill="#FF5A5F" stroke="#2D2A32" stroke-width="3.5"/>
    <!-- bean head -->
    <path d="M-38 20 L-38 -20 Q-38 -46 0 -46 Q38 -46 38 -20 L38 20 Z" fill="#B07CFF" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
    <!-- shifty eyes and evil grin -->
    <path d="M-24 -26 L-6 -20" stroke="#2D2A32" stroke-width="4" stroke-linecap="round"/>
    <path d="M24 -26 L6 -20" stroke="#2D2A32" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-14" cy="-12" rx="7" ry="6" fill="#FFFFFF" stroke="#2D2A32" stroke-width="2.5"/>
    <ellipse cx="14" cy="-12" rx="7" ry="6" fill="#FFFFFF" stroke="#2D2A32" stroke-width="2.5"/>
    <circle cx="-10" cy="-11" r="3" fill="#2D2A32"/><circle cx="18" cy="-11" r="3" fill="#2D2A32"/>
    <path d="M-14 4 Q0 14 16 2" fill="#2D2A32" stroke="#2D2A32" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-6 7 L-3 11 L0 8 M4 8 L7 11 L10 6" fill="#FFFFFF"/>
    <!-- curly mustache -->
    <path d="M0 -4 Q-12 -8 -18 0 Q-20 -6 -14 -8 M0 -4 Q12 -8 18 0 Q20 -6 14 -8" fill="none" stroke="#2D2A32" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- table with checkered tablecloth -->
  <path d="M-10 318 Q320 290 650 318 L650 400 L-10 400 Z" fill="url(#checks)" stroke="#2D2A32" stroke-width="5"/>
  <path d="M-10 318 Q320 290 650 318 L650 400 L-10 400 Z" fill="#2D2A32" opacity="0.12"/>

  <!-- chef fingers gripping the tablecloth -->
  <g transform="translate(82 290)">
    <!-- tiny fingers gripping the tablecloth -->
    <g fill="#B07CFF" stroke="#2D2A32" stroke-width="3">
      <circle cx="44" cy="20" r="7"/><circle cx="54" cy="20" r="7"/>
    </g>
  </g>

  <!-- cake stand -->
  <ellipse cx="300" cy="340" rx="64" ry="10" fill="#2D2A32" opacity="0.3"/>
  <path d="M276 336 L324 336 L312 300 L288 300 Z" fill="#DDF2FF" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="300" cy="298" rx="112" ry="16" fill="#DDF2FF" stroke="#2D2A32" stroke-width="4"/>
  <path d="M220 296 Q240 302 262 300" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- birthday cake -->
  <path d="M214 288 L214 238 Q300 222 386 238 L386 288 Q300 302 214 288 Z" fill="#F6D59A" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
  <path d="M214 262 Q300 276 386 262" fill="none" stroke="#FFB7D5" stroke-width="7"/>
  <ellipse cx="300" cy="236" rx="86" ry="15" fill="#FFB7D5" stroke="#2D2A32" stroke-width="4"/>
  <!-- frosting drips -->
  <path d="M218 238 Q222 256 230 244 Q236 260 246 247 Q256 266 264 249 Q276 258 286 250 L286 240 Z" fill="#FFB7D5"/>
  <path d="M316 250 Q326 264 336 249 Q346 262 354 247 Q364 258 372 244 Q378 254 384 240 L316 242 Z" fill="#FFB7D5"/>
  <path d="M218 238 Q222 256 230 244 Q236 260 246 247 Q256 266 264 249" fill="none" stroke="#E58AB0" stroke-width="3" stroke-linecap="round"/>
  <path d="M336 249 Q346 262 354 247 Q364 258 372 244" fill="none" stroke="#E58AB0" stroke-width="3" stroke-linecap="round"/>
  <g fill="#FFFFFF"><circle cx="240" cy="276" r="3"/><circle cx="300" cy="284" r="3"/><circle cx="360" cy="276" r="3"/></g>
  <!-- sprinkles -->
  <g stroke-width="3.5" stroke-linecap="round">
    <path d="M242 234 l6 -3" stroke="#3FA7FF"/><path d="M262 241 l5 3" stroke="#FFCF33"/>
    <path d="M336 240 l6 -2" stroke="#7BE07B"/><path d="M358 232 l4 4" stroke="#B07CFF"/>
  </g>

  <!-- the ridiculous leaning tower, tilting right -->
  <g transform="rotate(7 300 230)">

    <!-- toaster (bottom) -->
    <g transform="translate(292 206)">
      <rect x="-48" y="-30" width="96" height="54" rx="14" fill="#C9D3DD" stroke="#2D2A32" stroke-width="4"/>
      <rect x="-40" y="-22" width="20" height="40" rx="6" fill="#FFFFFF" opacity="0.55"/>
      <rect x="-30" y="-34" width="22" height="6" rx="3" fill="#2D2A32"/>
      <rect x="8" y="-34" width="22" height="6" rx="3" fill="#2D2A32"/>
      <!-- toast popping out -->
      <path d="M-28 -34 L-28 -48 Q-19 -58 -10 -48 L-10 -34 Z" fill="#E8B26A" stroke="#2D2A32" stroke-width="3" stroke-linejoin="round"/>
      <rect x="48" y="-6" width="10" height="16" rx="3" fill="#FF5A5F" stroke="#2D2A32" stroke-width="3"/>
      <!-- surprised face -->
      <circle cx="-4" cy="-2" r="4" fill="#2D2A32"/><circle cx="20" cy="-2" r="4" fill="#2D2A32"/>
      <ellipse cx="8" cy="12" rx="5" ry="6" fill="#2D2A32"/>
    </g>

    <!-- rubber chicken, draped sideways -->
    <g transform="translate(300 160) rotate(-8)">
      <!-- floppy feet sticking up -->
      <g stroke-linecap="round" stroke-linejoin="round">
        <path d="M-44 -8 L-56 -30" stroke="#2D2A32" stroke-width="8"/>
        <path d="M-44 -8 L-56 -30" stroke="#FF9A3C" stroke-width="4"/>
        <path d="M-56 -30 L-68 -34 M-56 -30 L-62 -42 M-56 -30 L-52 -42" stroke="#2D2A32" stroke-width="7"/>
        <path d="M-56 -30 L-68 -34 M-56 -30 L-62 -42 M-56 -30 L-52 -42" stroke="#FF9A3C" stroke-width="3.5"/>
        <path d="M-30 -10 L-34 -32" stroke="#2D2A32" stroke-width="8"/>
        <path d="M-30 -10 L-34 -32" stroke="#FF9A3C" stroke-width="4"/>
        <path d="M-34 -32 L-44 -40 M-34 -32 L-34 -44 M-34 -32 L-24 -40" stroke="#2D2A32" stroke-width="7"/>
        <path d="M-34 -32 L-44 -40 M-34 -32 L-34 -44 M-34 -32 L-24 -40" stroke="#FF9A3C" stroke-width="3.5"/>
      </g>
      <ellipse cx="-4" cy="2" rx="50" ry="16" fill="#FFE45C" stroke="#2D2A32" stroke-width="4"/>
      <path d="M-20 0 Q-6 8 10 0" fill="none" stroke="#E5C02E" stroke-width="3" stroke-linecap="round"/>
      <!-- long silly neck flopping over the edge -->
      <path d="M40 -2 Q66 -8 70 14 Q72 30 62 36" fill="none" stroke="#2D2A32" stroke-width="13" stroke-linecap="round"/>
      <path d="M40 -2 Q66 -8 70 14 Q72 30 62 36" fill="none" stroke="#FFE45C" stroke-width="7" stroke-linecap="round"/>
      <circle cx="60" cy="42" r="12" fill="#FFE45C" stroke="#2D2A32" stroke-width="3.5"/>
      <path d="M52 34 Q54 26 58 32 Q60 24 64 32" fill="#FF5A5F" stroke="#2D2A32" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M52 46 L44 52 L54 50 Z" fill="#FF9A3C" stroke="#2D2A32" stroke-width="2.5" stroke-linejoin="round"/>
      <g stroke="#2D2A32" stroke-width="2.5" stroke-linecap="round"><path d="M58 40 l5 5 M63 40 l-5 5"/></g>
      <!-- squeak lines -->
      <g stroke="#FFD9A0" stroke-width="3" stroke-linecap="round"><path d="M84 30 l10 -4"/><path d="M84 40 l11 2"/></g>
    </g>

    <!-- jelly with googly eyes -->
    <g transform="translate(296 110)">
      <ellipse cx="0" cy="26" rx="40" ry="7" fill="#2D2A32" opacity="0.2"/>
      <path d="M-38 24 Q-40 -18 -24 -30 Q0 -42 24 -30 Q40 -18 38 24 Q0 34 -38 24 Z" fill="url(#jelly)" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-24 -8 Q0 0 24 -8 M-30 10 Q0 18 30 10" fill="none" stroke="#3AA65A" stroke-width="3" stroke-linecap="round"/>
      <path d="M-26 -20 Q-20 -28 -10 -30" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      <!-- googly eyes looking in different directions -->
      <circle cx="-13" cy="-12" r="11" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <circle cx="-17" cy="-6" r="5" fill="#2D2A32"/>
      <circle cx="14" cy="-14" r="13" fill="#FFFFFF" stroke="#2D2A32" stroke-width="3"/>
      <circle cx="20" cy="-21" r="6" fill="#2D2A32"/>
      <path d="M-8 8 Q2 16 10 6" fill="none" stroke="#2D2A32" stroke-width="3" stroke-linecap="round"/>
      <!-- wobble lines -->
      <g fill="none" stroke="#FFD9A0" stroke-width="3" stroke-linecap="round">
        <path d="M-52 -14 Q-58 -4 -52 6"/><path d="M52 -16 Q58 -6 52 4"/>
      </g>
    </g>

    <!-- fish on top, mid-flop -->
    <g transform="translate(300 64) rotate(-14)">
      <path d="M-40 0 Q-10 -26 26 -6 Q34 0 26 6 Q-10 26 -40 0 Z" fill="#3FA7FF" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
      <path d="M24 0 L46 -16 L42 0 L46 16 Z" fill="#3FA7FF" stroke="#2D2A32" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-6 -6 Q0 0 -6 8 M6 -6 Q12 0 6 8" fill="none" stroke="#2A7FCC" stroke-width="2.5"/>
      <circle cx="-26" cy="-4" r="6" fill="#FFFFFF" stroke="#2D2A32" stroke-width="2.5"/>
      <circle cx="-27" cy="-4" r="2.6" fill="#2D2A32"/>
      <ellipse cx="-38" cy="5" rx="3" ry="4" fill="#2D2A32"/>
    </g>
  </g>

  <!-- motion wobble marks beside the tower -->
  <g fill="none" stroke="#FFD9A0" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M378 56 Q388 66 380 78"/><path d="M392 48 Q406 66 394 86"/>
  </g>

  <!-- glowing gold case card with x5 -->
  <circle cx="452" cy="110" r="70" fill="url(#cardGlow)"/>
  <g transform="translate(452 112) rotate(10)">
    <rect x="-42" y="-56" width="84" height="112" rx="12" fill="url(#gold)" stroke="#2D2A32" stroke-width="5"/>
    <rect x="-32" y="-46" width="64" height="92" rx="8" fill="none" stroke="#FFF3B0" stroke-width="3" stroke-dasharray="6 5"/>
    <text x="0" y="16" text-anchor="middle" font-family="Fredoka, 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif" font-weight="700" font-size="44" fill="#2D2A32">×5</text>
    <path d="M-14 -34 L-10 -26 L-2 -26 L-8 -20 L-6 -12 L-14 -16 L-22 -12 L-20 -20 L-26 -26 L-18 -26 Z" fill="#FFF3B0"/>
  </g>
  <!-- sparkles around the card -->
  <g fill="#FFCF33" stroke="#2D2A32" stroke-width="3" stroke-linejoin="round">
    <path transform="translate(508 52) scale(0.7)" d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z"/>
    <path transform="translate(400 176) scale(0.55)" d="M0 -14 L4 -4 L14 -4 L6 2 L9 12 L0 6 L-9 12 L-6 2 L-14 -4 L-4 -4 Z"/>
  </g>
  <g fill="#FFF3B0"><circle cx="398" cy="68" r="3"/><circle cx="506" cy="176" r="3.5"/></g>

  <!-- coins on the table -->
  <g stroke="#2D2A32" stroke-width="3.5">
    <ellipse cx="454" cy="352" rx="20" ry="8" fill="#E8A317"/>
    <ellipse cx="454" cy="346" rx="20" ry="8" fill="#FFCF33"/>
    <ellipse cx="454" cy="338" rx="20" ry="8" fill="#FFCF33"/>
    <ellipse cx="490" cy="364" rx="16" ry="6.5" fill="#FFCF33"/>
  </g>

</svg>
